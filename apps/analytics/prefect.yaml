name: analytics
prefect-version: 3.0.0

build: []
push: []
pull:
  - prefect.deployments.steps.pull.git_clone:
      id: clone-step
      repository: https://github.com/arthishaxom/kiittime.git
      branch: main
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone-step.directory }}/apps/analytics"

deployments:
  - name: nightly-etl
    version: 1.0.0
    entrypoint: src/analytics/flows/nightly_etl.py:nightly_etl_flow
    work_pool:
      name: kiittime-managed
      job_variables:
        env:
          PYTHONPATH: "src"
        pip_packages:
          - "axiom-py>=0.12.0"
          - "boto3>=1.37.0"
          - "deltalake>=0.25.0"
          - "duckdb>=1.2.0"
          - "pydantic-settings>=2.8.0"
          - "pyarrow>=15.0.0"
    schedule:
      cron: "0 2 * * *"
      timezone: "Asia/Kolkata"
