[project]
name = "analytics"
version = "0.1.0"
description = "Analytics ETL and DuckDB data engineering pipeline"
readme = "README.md"
authors = [
    { name = "Ashish Pothal", email = "ashishpothal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "axiom-py>=0.12.0",
    "boto3>=1.37.0",
    "deltalake>=0.25.0",
    "duckdb>=1.2.0",
    "prefect>=3.2.0",
    "python-dotenv>=1.2.0",
    "pydantic-settings>=2.8.0",
    "pyarrow>=15.0.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Logger 'prefect.task_runs' attempted to send logs:UserWarning",
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportUninitializedInstanceVariable = "none"
reportMissingTypeArgument = "none"
